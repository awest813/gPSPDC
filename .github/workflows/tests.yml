name: Host tests

on:
  workflow_dispatch:
  push:
    branches: [dreamcast, 'cursor/**', 'claude/**', 'codex/**']
  pull_request:
    branches: [dreamcast]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run contract tests
        run: make -C tests test
      - name: Install SH-4 cross compiler and qemu
        run: sudo apt-get update && sudo apt-get install -y gcc-sh4-linux-gnu qemu-user
      - name: Execute the SH-4 dynarec under qemu
        run: make -C tests sh4-exec
